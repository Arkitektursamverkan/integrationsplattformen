# Månadsvis, och mindre uppdateringar samlade i en pull request per
# paketsystem: varje pull request kör CI, och Actions-minuterna är begränsade.
# Nya huvudversioner kommer var för sig. Säkerhetsuppdateringar kommer som
# förut, direkt.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # Typerna följer Node-versionen i avbilden (24, LTS), inte den senaste.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
    ignore:
      # Udda Node-versioner får aldrig långtidsstöd (LTS); bygg bara på jämna.
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
