# Integration Platform – generic installation.
#
# Everything installation-specific comes from .env (see .env.example). An
# organisation's own additions go in an overlay file listed in COMPOSE_FILE in
# .env, so this file stays the same for everyone.

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration_db
      POSTGRES_USER: integration_user
      # Only read when the volume is first created; changing it afterwards
      # needs ALTER USER in the database as well.
      # Krävs – inget standardlösenord (skapa med: openssl rand -hex 16).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env – openssl rand -hex 16}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_user -d integration_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (scheduler job store + future task queue) ─────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      target: runtime
    # Inte publicerad: webben (nginx) når API:t över compose-nätet, och
    # Arkitekturportalen över det delade nätet (deploy/shared-network.yml).
    # Behövs porten på värden (utveckling, /api/docs direkt): lägg till
    # deploy/api-port.yml i COMPOSE_FILE – se .env.example.
    environment:
      DATABASE_URL: postgresql+asyncpg://integration_user:${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}@db:5432/integration_db
      REDIS_URL: redis://redis:6379/0
      # Anything but development/test refuses to start with placeholder
      # secrets – see .env.example for how to generate them.
      APP_ENV: ${APP_ENV:-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      # Rate limits per X-Forwarded-For instead of the proxy's address – see .env.example.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXECUTION_LOG_RETENTION_DAYS: ${EXECUTION_LOG_RETENTION_DAYS:-30}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      POST_EXEC_WEBHOOK_SECRET: ${POST_EXEC_WEBHOOK_SECRET:-}
      ARKITEKTEN_URL: ${ARKITEKTEN_URL:-}
      ARK_FLODESTJANST_NYCKEL: ${ARK_FLODESTJANST_NYCKEL:-}
      # Spärr mot interna adresser i kopplingar – se .env.example.
      CONNECTOR_BLOCK_INTERNAL: ${CONNECTOR_BLOCK_INTERNAL:-auto}
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-}
      ENTRA_REQUIRED_SCOPE: ${ENTRA_REQUIRED_SCOPE:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      SETUP_CODE: ${SETUP_CODE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/seed:/app/seed:ro
    restart: unless-stopped

  # ── React frontend ──────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "${WEB_PORT:-3100}:80"
    # Webben kör nginx som en vanlig användare (nginx-unprivileged) men lyssnar
    # ändå på 80: Docker tillåter det som standard, och raden gör det tydligt.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      # Proxyn framför webben, om någon – se .env.example.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
