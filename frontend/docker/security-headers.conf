# Security headers, included in the server block and in every location that
# sets headers of its own (an add_header in a location replaces the server's).
# The web signs in with an MSAL redirect: the browser leaves for
# login.microsoftonline.com and comes back, and MSAL calls its token endpoint.
# MUI writes its styles at runtime, hence 'unsafe-inline' for styles only.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
# Tomt (över http) = inget huvud; se map $ip_hsts i default.conf.template.
add_header Strict-Transport-Security $ip_hsts always;
